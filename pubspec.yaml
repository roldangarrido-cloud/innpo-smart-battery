name: innpo_smart_battery
description: Professional BLE monitoring, diagnostics, and reporting app for INNPO smart batteries.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  logger: ^2.4.0
  collection: ^1.18.0
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/innpo_logo.png
